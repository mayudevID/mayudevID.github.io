name: Portfolio Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build Jekyll and validate portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Validate localized pages, links and assets
        run: python3 scripts/check_portfolio.py --site _site

      - name: Validate JavaScript syntax
        run: node --check assets/js/site.js
